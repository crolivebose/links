<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今月の周年記念盤</title>
<meta name="description" content="商品情報に周年記念の記載がある、今月発売の作品です。">
<meta property="og:title" content="今月の周年記念盤">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--ground:#0f0d0c;--surface:#1a1513;--line:#332a25;--text:#f4efe8;--muted:#a3948a;
--accent:#c9813c;--accent-ink:#1a1007;--ok:#7fb069;
--body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.7;
-webkit-font-smoothing:antialiased}
.page{max-width:600px;margin:0 auto;padding:32px 18px 56px;display:grid;gap:26px}
.pr{justify-self:start;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 12px}
.cover{width:100%;max-width:330px;align-self:center;border-radius:10px;display:block;margin:0 auto 6px;
box-shadow:0 18px 40px rgba(0,0,0,.45);background:var(--surface)}
header{display:grid;gap:8px}
.status{justify-self:start;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:3px 14px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.26em;color:var(--muted)}
h1{margin:0;font-size:clamp(28px,8vw,42px);line-height:1.2;font-weight:800;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0;font-family:var(--mono);font-size:12.5px;color:var(--muted);
font-variant-numeric:tabular-nums}
.meta b{color:var(--text);font-weight:500}
.spec{display:grid;gap:4px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.spec .row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.spec .row span:first-child{color:var(--muted)}
h2{margin:0;font-size:12px;letter-spacing:.2em;color:var(--muted);display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.common{display:grid;gap:3px;padding:13px 16px;border-radius:11px;background:var(--surface);
border:1px solid var(--line)}
.common .label{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent)}
.stores{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.stores a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:11px;
text-decoration:none;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--text)}
.stores a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center}
.stores .logo{display:flex;align-items:center;justify-content:center;width:86px;height:40px;
padding:5px 8px;border-radius:9px;flex-shrink:0}
.stores .logo--light{background:#fff}
.stores .logo--dark{background:#000;border:1px solid #2c2c2c}
.stores .logo img{max-width:100%;max-height:100%;object-fit:contain}
.stores .store{display:grid;gap:2px;min-width:0}
.stores .name{font-weight:700}
.stores .bonus{font-size:12px;font-weight:400;color:var(--muted);line-height:1.5}
.stores .price{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--text)}
.stores a.buy{border-color:var(--accent);color:var(--accent)}
.stores a:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stores a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tag{font-size:12px;font-weight:500;color:var(--muted)}
.stores a.buy .tag{color:var(--accent)}
.lead{margin:0;font-size:13px;color:var(--muted)}
.stores--multi .shop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 14px;align-items:center;
padding:14px 16px;border-radius:11px;background:var(--surface);border:1px solid var(--line)}
.stores--multi .shop .store{display:grid;gap:2px;min-width:0}
.stores--multi .buys{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stores--multi .buys a{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;
padding:9px 12px;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;
border:1px solid var(--line);color:var(--muted);background:transparent}
.stores--multi .buys a.buy{border-color:var(--accent);color:var(--accent)}
.stores--multi .buys a:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stores--multi .buys a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stores--multi .buys .price{font-family:var(--mono);font-weight:500;font-size:12.5px;opacity:.9}
.list{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.list .day{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--accent);
margin:14px 0 2px;display:flex;align-items:center;gap:10px}
.list .day::after{content:"";flex:1;height:1px;background:var(--line)}
.item{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;
padding:11px 13px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
text-decoration:none;color:var(--text)}
.item:hover{border-color:var(--accent)}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:11px;background:var(--ground);display:block}
.thumb--none{background:var(--ground)}
.item .body{display:grid;gap:3px;min-width:0}
.item .artist{font-size:12px;color:var(--muted)}
.item .name{font-weight:700;font-size:16px;line-height:1.35}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.badge{font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);
border-radius:999px;padding:1px 9px;white-space:nowrap}
.badge--now{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);font-weight:700}
.badge--quiet{border-style:dashed}
footer{display:grid;gap:6px;font-size:12px;color:var(--muted)}
footer a{color:var(--muted)}
footer p{margin:0}
</style>
</head>
<body>
<main class="page">
<span class="pr">PR・このページはアフィリエイトリンクを含みます</span>

</main>
</body>
</html>
