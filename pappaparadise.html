<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宇多田ヒカル『パッパパラダイス』 ストアリンク集</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Helvetica Neue', sans-serif;
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 560px;
      margin: auto;
    }

    .cover {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .release {
      color: #999;
      margin-bottom: 25px;
    }

    .store {
      background: #222;
      border-radius: 10px;
      margin: 12px 0;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ロゴ画像をモバイルでも適切なサイズに制御 */
    .store img {
      max-height: 32px;   /* 高さを固定上限 */
      max-width: 120px;   /* 幅の暴走を防止 */
      height: auto;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;      /* 文字量で圧縮されないように */
    }

    .store span {
      flex: 1;
      text-align: left;
      margin-left: 12px;
      font-size: 14px;
    }

    .store a {
      background: #334;
      color: #fff;
      padding: 8px 14px;
      text-decoration: none;
      border-radius: 5px;
      font-size: 14px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="pappaparadise_cover.jpg" alt="パッパパラダイス ジャケット" class="cover">

    <h1>宇多田ヒカル<br>『パッパパラダイス』</h1>
    <p class="release">2026年6月24日 Release</p>
